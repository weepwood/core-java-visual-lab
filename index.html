<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>Java Core Visual Lab</title>
<style>
:root{font-family:Inter,"Segoe UI",system-ui,"Microsoft YaHei",sans-serif;color:#e4eaf3;background:#0d1420;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #7ea9ff;outline-offset:3px}a{color:#8fbbff}.layout{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}.side{padding:27px 17px;background:#101a2a;border-right:1px solid #27364c;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-weight:800;font-size:18px;letter-spacing:-.4px}.brand b{color:#e7a36e}.sub{font-size:12px;color:#94a6bd;margin-top:6px}.group{margin-top:33px;font-size:11px;letter-spacing:1.5px;color:#7c8da5}.nav{display:block;width:100%;text-align:left;padding:12px 13px;background:transparent;color:#adbad0;border:0;border-radius:9px;margin-top:5px}.nav:hover,.nav.active{background:#263a54;color:#fff}.main{max-width:1300px;width:100%;margin:auto;padding:36px 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px}.eyebrow{font-size:12px;letter-spacing:2px;color:#efab78;font-weight:700}.hero{margin-top:38px;background:radial-gradient(ellipse at 87% 12%,#28466a 0,transparent 48%),linear-gradient(135deg,#1c304c,#142235);border:1px solid #354c66;border-radius:23px;padding:36px}.hero h1{font-size:clamp(29px,4vw,49px);letter-spacing:-1.6px;margin:14px 0}.muted{color:#9eafc4;line-height:1.8}.pills{display:flex;flex-wrap:wrap;gap:9px;margin:24px 0 0}.pill{font-size:12px;border:1px solid #405673;color:#bed4e9;border-radius:999px;padding:7px 12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:22px 0 36px}.stat,.card,.lab,.reader{border:1px solid #2b3d54;border-radius:15px;background:#151f2e}.stat{padding:19px}.stat strong{font-size:30px}.stat span{display:block;color:#8d9fb5;font-size:12px;margin-top:6px}.row{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.section{margin:30px 0 16px;font-size:21px}.search{background:#101a28;color:white;border:1px solid #364962;border-radius:10px;padding:11px 14px;width:min(310px,100%)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.card{padding:20px;text-align:left;color:#e4eaf3;transition:transform .15s,border-color .15s;min-height:160px}.card:hover{transform:translateY(-2px);border-color:#7eaddb}.num{font-size:12px;color:#e6a36f}.card h3{font-size:17px;margin:12px 0}.card p{color:#97aac1;font-size:12px;line-height:1.6}.progress{height:6px;background:#27374a;border-radius:9px;overflow:hidden;margin-top:14px}.fill{height:100%;background:#72c7ae}.labs{display:grid;grid-template-columns:1fr 1fr;gap:14px}.lab{padding:22px}.lab h3{margin:0}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.action{background:#2c567d;color:white;border:1px solid #4177a5;border-radius:9px;padding:9px 13px}.action:hover{background:#3973a8}.action.secondary{background:#26364b;border-color:#3b4c63}.cells{display:flex;gap:7px;margin:20px 0;flex-wrap:wrap}.cell{height:55px;min-width:54px;border-radius:9px;background:#243f5c;border:1px solid #5e8db7;text-align:center;padding:8px}.cell small{display:block;color:#93b4ce;font-size:10px;margin-bottom:4px}.flow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:23px 0}.node{padding:11px 12px;border:1px solid #4b617e;border-radius:9px;color:#b6cbe0}.node.on{background:#315f6a;border-color:#72c7ae;color:#fff}.arrow{color:#7092ae}.reader{padding:28px;max-width:980px}.reader h2{font-size:31px}.reader pre{overflow:auto;border-radius:12px;background:#0a101b;color:#b9e8cf;padding:20px;line-height:1.6}.reader p{line-height:1.85;color:#b1c2d7}.reader ul{line-height:2;color:#b1c2d7}.quiz-option{display:block;text-align:left;width:100%;padding:12px;margin:9px 0;background:#202e40;border:1px solid #3d526b;border-radius:10px;color:#edf4ff}.quiz-option.selected{border-color:#e3aa72;background:#384052}.success{color:#8bdbc2}.error{color:#ffb9aa}.empty{padding:30px;text-align:center;color:#99a9bd}.back{border:0;background:transparent;color:#8dbdf8;padding:0;margin-bottom:14px}@media(max-width:900px){.layout{grid-template-columns:1fr}.side{position:static;height:auto;padding:16px}.side .group,.side .nav{display:none}.main{padding:22px}.labs{grid-template-columns:1fr}}@media(max-width:500px){.hero{padding:22px}.stats{grid-template-columns:1fr 1fr}.stat strong{font-size:23px}.reader{padding:19px}}
</style></head><body><div id="app"></div><script>
const chapters=[
["Java 程序设计概述","Java 平台、JDK、JRE、JVM，以及编译与运行","基础"],["Java 程序设计环境","安装 JDK、JShell、IDE 与程序执行","基础"],["Java 的基本程序设计结构","变量、基本类型、运算符、字符串、数组与控制流程","基础"],["对象与类","封装、实例、构造器、静态成员与对象引用","核心"],["继承","多态、重写、类型转换与抽象类","核心"],["接口、lambda 表达式与内部类","接口契约、函数式接口、闭包与回调","核心"],["异常、断言和日志","异常传播、资源管理与可观测性","核心"],["泛型程序设计","泛型类型、类型擦除、通配符及其边界","进阶"],["集合","List、Set、Map、迭代器与算法","核心"],["图形用户界面程序设计","Swing 组件、窗口与事件","扩展"],["Swing 用户界面组件","布局管理与交互组件","扩展"],["并发","线程、锁、竞态与异步任务","核心"],["Stream 库","流水线、惰性操作、聚合与并行流","核心"],["输入与输出","流、路径、文件、序列化","核心"],["XML","XML 解析、DOM、SAX 与转换","扩展"],["网络","Socket、HTTP 和网络客户端","进阶"],["数据库编程","JDBC、连接与事务","进阶"],["日期与时间 API","Instant、LocalDateTime、时区与格式化","核心"],["国际化","Locale、资源包、消息格式化","扩展"],["高级 Swing 和图形","高级桌面 GUI 与绘图","扩展"],["高级 AWT","桌面系统、剪贴板与打印","扩展"],["安全","加密、签名、认证与安全设计","进阶"],["平台模块系统","模块描述、依赖和封装边界","进阶"],["本地方法","Java 与本地代码互操作及风险","扩展"]
];
const deep={
0:{concept:"Java 源代码先由 javac 编译成字节码（.class），再由 JVM 加载、验证和执行。JDK 包含开发工具和运行所需能力；JVM 是运行字节码的虚拟机，JRE 概念对应运行环境。",points:["一次编写、跨平台运行依赖不同平台上的 JVM 实现。","字节码不是机器码；JIT 可以把热点字节码编译为本机指令。","Java SE 是语言与标准 API 平台，不等同于某个特定 JDK 发行版。"],code:"public class Hello {\n    public static void main(String[] args) {\n        System.out.println(\"Hello, Java!\");\n    }\n}\n// javac Hello.java\n// java Hello",q:"javac 主要把 .java 文件编译成什么？",options:["直接生成 Windows exe","Java 字节码 .class","数据库记录"],answer:1,why:"javac 编译后通常产生 .class 字节码，交由 JVM 加载并执行。"},
2:{concept:"基本类型变量保存其类型的值；引用类型变量保存对对象的引用。Java 参数传递始终是值传递：传入对象引用时，复制的是引用值，而不是把变量本身传入。",points:["int 与 double 属于基本类型；String 和数组属于引用类型。","数组具有固定长度，索引从 0 开始。","String 不可变；不要用 == 比较两个字符串的文本内容。"],code:"int[] scores = {10, 20, 30};\nint[] alias = scores;\nalias[1] = 99;\nSystem.out.println(scores[1]); // 99",q:"两个变量指向同一个数组，修改其中一个变量引用的数组元素会怎样？",options:["另一个变量看到变化","原数组会自动复制","编译错误"],answer:0,why:"两个引用指向同一个数组对象，因此元素修改是共享可见的。"},
3:{concept:"类定义状态和行为；对象是类的实例。通过封装控制内部状态的访问，构造器建立对象初始状态，实例方法操作对象。",points:["使用 private 隐藏实现细节，通过方法暴露稳定 API。","对象在堆上分配的描述适用于通常情形，具体优化由 JVM 决定。","== 对引用比较的是同一性；equals 通常用于逻辑相等。"],code:"class Counter {\n    private int value;\n    public void increment() { value++; }\n    public int getValue() { return value; }\n}",q:"对于一般的两个对象引用，== 比较什么？",options:["字段逐一相等","两个引用是否指向同一个对象","toString 输出"],answer:1,why:"引用类型的 == 比较引用同一性，逻辑相等一般交由 equals 定义。"},
8:{concept:"Java 集合框架提供不同时间复杂度和语义的容器。选型时先看是否需要索引、顺序、唯一性或按键查询，再看并发和复杂度。",points:["ArrayList 擅长随机访问；中间位置插入可能移动后续元素。","HashSet 重视元素唯一性，不保证迭代顺序。","HashMap 使用键值映射；可变键可能破坏查找的正确性。"],code:"Map<String, Integer> count = new HashMap<>();\ncount.merge(\"java\", 1, Integer::sum);\nSystem.out.println(count.get(\"java\"));",q:"要求元素不重复，优先考虑哪个接口？",options:["List","Set","Queue"],answer:1,why:"Set 描述的是不包含重复元素的集合语义。"},
11:{concept:"并发需要区分调度、共享状态和内存可见性。多线程同时操作可变状态会产生竞态；锁、原子变量及并发容器提供不同同步策略。",points:["start() 创建新线程并安排执行；直接调用 run() 不会启动新线程。","volatile 主要保障可见性和有序性，不会让 i++ 成为原子操作。","线程状态图反映 Java Thread.State 的简化视角。"],code:"Thread worker = new Thread(() -> {\n    System.out.println(\"working\");\n});\nworker.start();\nworker.join();",q:"直接调用 thread.run() 会发生什么？",options:["创建一个新线程","在当前线程普通调用 run 方法","自动执行 join"],answer:1,why:"run() 是普通方法调用；要启动新执行线程应调用 start()。"},
12:{concept:"Stream 使用声明式操作描述数据处理管道。中间操作通常是惰性的，只有遇到终端操作才执行整个流水线。",points:["map 负责映射，filter 负责筛选，reduce 用于折叠。","一个 Stream 被终端操作消费后不可重用。","并行流不必然更快；要考虑拆分成本、状态和顺序。"],code:"List<Integer> result = List.of(1,2,3,4,5)\n    .stream().filter(n -> n % 2 == 0)\n    .map(n -> n * n).toList();\n// [4,16]",q:"以下哪一个是终端操作？",options:["filter","map","count"],answer:2,why:"count 产生最终结果，触发惰性管道求值。"}
};
const key="java-visual-lab-progress-v1";let completed=[];try{completed=JSON.parse(localStorage.getItem(key)||"[]")}catch{};let selected=null,answer=null,arr=[10,20,30],thread=0,filter="";
const app=document.getElementById("app");
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function nav(){return '<aside class="side"><div class="brand">◈ Java <b>Core</b> Lab</div><div class="sub">Java 核心技术 · 交互式学习</div><div class="group">LEARNING SPACE</div><button class="nav '+(selected===null?'active':'')+'" onclick="goHome()">▦ &nbsp; 知识总览</button><button class="nav" onclick="document.getElementById(\'experiments\')?.scrollIntoView({behavior:\'smooth\'})">⌁ &nbsp; 交互实验</button><div class="group">VOLUME I · 开发基础</div>'+chapters.slice(0,12).map((c,i)=>'<button class="nav '+(selected===i?'active':'')+'" onclick="openChapter('+i+')">'+String(i+1).padStart(2,'0')+' &nbsp; '+esc(c[0])+'</button>').join('')+'<div class="group">VOLUME II · 高级特性</div>'+chapters.slice(12).map((c,i)=>'<button class="nav '+(selected===i+12?'active':'')+'" onclick="openChapter('+(i+12)+')">'+String(i+13).padStart(2,'0')+' &nbsp; '+esc(c[0])+'</button>').join('')+'</aside>'}
function render(){app.innerHTML='<div class="layout">'+nav()+'<main class="main"><div class="top"><span class="eyebrow">INTERACTIVE JAVA HANDBOOK / 2026</span><span class="pill">Java 17 · 第12版知识框架</span></div>'+(selected===null?home():reader())+'</main></div>'}
function home(){const list=chapters.map((c,i)=>({c,i})).filter(o=>(o.c.join('')+(o.i+1)).toLowerCase().includes(filter.toLowerCase()));return '<section class="hero"><span class="eyebrow">BUILD YOUR MENTAL MODEL</span><h1>理解 Java，不止于阅读代码。</h1><p class="muted">将《Java 核心技术》的核心概念拆解为知识地图、可视化实验、示例和自测。通过观察状态变化，建立从语言语法到运行机制的完整认知。</p><div class="pills"><span class="pill">24 章知识路线</span><span class="pill">6 章深度入门内容</span><span class="pill">2 个动态实验</span><span class="pill">本地保存学习状态</span></div></section><div class="stats"><div class="stat"><strong>24</strong><span>知识章节</span></div><div class="stat"><strong>6</strong><span>已编写详细示例章节</span></div><div class="stat"><strong>'+completed.length+' / 24</strong><span>已完成学习</span><div class="progress"><div class="fill" style="width:'+(completed.length/24*100)+'%"></div></div></div></div><div class="row"><h2 class="section">章节知识地图</h2><input aria-label="搜索章节" class="search" placeholder="搜索章节或知识主题..." value="'+esc(filter)+'" oninput="searchChapters(this.value)"></div><div class="grid">'+(list.length?list.map(({c,i})=>'<button class="card" onclick="openChapter('+i+')"><span class="num">'+(i<12?'VOL I':'VOL II')+' / '+String(i<12?i+1:i-11).padStart(2,'0')+' · '+c[2]+'</span><h3>'+esc(c[0])+'</h3><p>'+esc(c[1])+'</p><div class="pill" style="display:inline-block;margin-top:7px">'+(completed.includes(i)?'✓ 已学习':deep[i]?'查看完整学习卡':'查看知识概览')+'</div></button>').join(''):'<p class="empty">没有找到匹配章节</p>')+'</div><section id="experiments"><h2 class="section">动手理解运行机制</h2><div class="labs"><article class="lab"><span class="num">LAB / 01 · REFERENCE</span><h3>数组与引用</h3><p class="muted">模拟两个引用指向同一数组，观察修改元素如何影响共享对象。</p><div class="cells">'+arr.map((v,i)=>'<div class="cell"><small>['+i+']</small>'+v+'</div>').join('')+'</div><div class="muted">scores ─┐<br>alias &nbsp; ─┴──→ 同一个数组对象</div><div class="controls"><button class="action" onclick="mutateArray()">修改 alias[1]</button><button class="action secondary" onclick="resetArray()">重置</button></div><small class="muted">这是引用共享的概念模拟，不是 JVM 内存实时监测。</small></article><article class="lab"><span class="num">LAB / 02 · CONCURRENCY</span><h3>线程生命周期</h3><p class="muted">按步骤切换教学状态，区分 NEW、RUNNABLE、WAITING、TERMINATED。</p><div class="flow">'+['NEW','RUNNABLE','WAITING','TERMINATED'].map((s,i)=>'<span class="node '+(thread===i?'on':'')+'">'+s+'</span>'+(i<3?'<span class="arrow">→</span>':'')).join('')+'</div><p class="muted">当前状态：<strong>'+['NEW — 尚未启动','RUNNABLE — 可运行/正在运行','WAITING — 等待其他线程动作','TERMINATED — 运行结束'][thread]+'</strong></p><div class="controls"><button class="action" onclick="nextThread()">下一状态 →</button><button class="action secondary" onclick="resetThread()">重新开始</button></div><small class="muted">教学路径为示例；真实状态之间不必按此固定顺序转换。</small></article></div></section><p class="muted" style="margin:35px 0">内容基于《Java 核心技术》第12版的主题结构独立编写，非书籍原文复制；部分较高级章节目前仅提供知识导航，后续逐步丰富。</p>'}
function reader(){let c=chapters[selected],d=deep[selected];return '<div class="reader"><button class="back" onclick="goHome()">← 返回知识地图</button><span class="num">VOL '+(selected<12?'I':'II')+' · CHAPTER '+(selected+1)+'</span><h2>'+esc(c[0])+'</h2><p>'+esc(c[1])+'</p><h3>核心知识梳理</h3><p>'+esc(d?d.concept:'本章的学习目标是理解：'+c[1]+'。当前已纳入完整路线图；详细原创讲义、可运行示例和测验正在逐章扩展。')+'</p><h3>学习要点</h3><ul>'+(d?d.points.map(x=>'<li>'+esc(x)+'</li>').join(''):'<li>准确理解本章关键术语和 API 使用边界。</li><li>编写最小可运行示例，说明核心行为。</li><li>结合实际工程场景比较适用条件与常见误区。</li>')+'</ul>'+(d?'<h3>代码示例</h3><pre><code>'+esc(d.code)+'</code></pre><h3>知识检测</h3><p>'+esc(d.q)+'</p>'+d.options.map((x,i)=>'<button class="quiz-option '+(answer===i?'selected':'')+'" onclick="pickAnswer('+i+')">'+String.fromCharCode(65+i)+'. '+esc(x)+'</button>').join('')+(answer!==null?'<p class="'+(answer===d.answer?'success':'error')+'">'+(answer===d.answer?'✓ 回答正确。':'✕ 还需要复习。')+' '+esc(d.why)+'</p>':''):'<p class="muted">本章详细交互内容尚未发布，现阶段可标记学习状态。</p>')+'<div class="controls"><button class="action" onclick="toggleComplete()">'+(completed.includes(selected)?'✓ 已完成 · 取消标记':'标记本章已学习')+'</button><button class="action secondary" onclick="openChapter('+(selected+1)%24+')">下一章 →</button></div></div>'}
function openChapter(i){selected=i;answer=null;render();window.scrollTo(0,0)}function goHome(){selected=null;render();window.scrollTo(0,0)}function searchChapters(s){filter=s;const old=document.activeElement;const pos=old.selectionStart;render();const el=document.querySelector('.search');el.focus();el.setSelectionRange(pos,pos)}function mutateArray(){arr[1]+=10;render()}function resetArray(){arr=[10,20,30];render()}function nextThread(){thread=Math.min(3,thread+1);render()}function resetThread(){thread=0;render()}function pickAnswer(i){answer=i;render()}function toggleComplete(){completed=completed.includes(selected)?completed.filter(x=>x!==selected):[...completed,selected];localStorage.setItem(key,JSON.stringify(completed));render()}render();
</script></body></html>
